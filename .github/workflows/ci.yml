name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check src/ tests/

      - name: Unit tests (pytest)
        run: uv run pytest

      - name: Smoke — providers register and dry-run plans
        run: |
          uv run coverage-acquisition list-providers
          uv run coverage-acquisition fetch-provider \
            --provider yandex --preset abakan_bbox \
            --output-root /tmp/ci-smoke --dry-run
