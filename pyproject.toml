[project]
name = "cross-source-svi-coverage-acquisition"
version = "0.1.0"
description = "Acquisition and validation tools for heterogeneous street-view coverage layers."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mapbox-vector-tile>=2.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyproj>=3.6",
    "requests>=2.31",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
notebook = [
    "ipykernel>=6.29",
    "jupyterlab>=4.0",
    "matplotlib>=3.8",
    "playwright>=1.45",
]

[project.scripts]
coverage-acquisition = "coverage_acquisition.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_acquisition"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
