[project]
name = "cross-source-svi-coverage"
version = "0.1.0"
description = "Cross-source street-level image coverage acquisition and a global SVI availability database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "protobuf>=4.25",
    "mapbox-vector-tile>=2.0",
    "mercantile>=1.2",
    "pandas>=2.1",
    "openpyxl>=3.1",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyproj>=3.6",
    "pyarrow>=14.0",
    "rasterio>=1.3",
    "rio-cogeo>=5.3",
    "pystac>=1.10",
    "python-dotenv>=1.0",
]

[project.scripts]
coverage-acquisition = "coverage_acquisition.cli:main"

[project.optional-dependencies]
notebook = [
    "jupyter>=1.0",
    "ipykernel>=6.29",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coverage_acquisition"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# geo.py holds reference coordinate-conversion constant tables that do not wrap.
"src/coverage_acquisition/geo.py" = ["E501"]
# Tests favor readable inline fixtures over strict line length.
"tests/*" = ["E501"]
