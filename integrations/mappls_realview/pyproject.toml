[project]
name = "mappls-realview-coverage"
version = "0.3.0"
description = "Authorized Mappls Web SDK workflow with production/debug RealView tile output"
requires-python = ">=3.10"
dependencies = [
  "mapbox-vector-tile>=2.0",
  "shapely>=2.0",
  "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"tests/*.py" = ["E402"]
